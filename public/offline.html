<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#006d5a" />
  <title>Sin conexión — Sala de Profes</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Barlow', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: #fefcf9;
      color: #1a1a1a;
      padding: 2rem;
      text-align: center;
    }

    .icon {
      width: 64px;
      height: 64px;
      margin-bottom: 1.5rem;
      opacity: 0.5;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #006d5a;
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 1rem;
      color: #666;
      margin-bottom: 2rem;
      max-width: 320px;
      line-height: 1.5;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #e5e5e5;
      border-top-color: #006d5a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1rem;
    }

    .status {
      font-size: 0.85rem;
      color: #999;
    }

    .retry-btn {
      margin-top: 1.5rem;
      padding: 0.6rem 1.5rem;
      border: 1.5px solid #006d5a;
      border-radius: 0.75rem;
      background: transparent;
      color: #006d5a;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .retry-btn:hover {
      background: #006d5a;
      color: #fff;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#006d5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="1" y1="1" x2="23" y2="23" />
    <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
    <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
    <path d="M10.71 5.05A16 16 0 0 1 22.56 9" />
    <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
    <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
    <line x1="12" y1="20" x2="12.01" y2="20" />
  </svg>

  <h1>Sin conexión</h1>
  <p>No hay conexión a internet. Reintentando automáticamente...</p>

  <div class="spinner"></div>
  <span class="status" id="status">Reconectando...</span>

  <button class="retry-btn" onclick="window.location.reload()">Reintentar ahora</button>

  <script>
    let attempts = 0;

    function tryReconnect() {
      attempts++;
      const el = document.getElementById('status');
      el.textContent = 'Intento ' + attempts + '...';

      fetch('/', { method: 'HEAD', cache: 'no-store' })
        .then((res) => {
          if (res.ok) {
            el.textContent = 'Conectado — recargando...';
            window.location.reload();
          } else {
            schedule();
          }
        })
        .catch(() => schedule());
    }

    function schedule() {
      // Back-off: 3s, 5s, 8s, then 10s max
      const delay = Math.min(3000 + attempts * 2000, 10000);
      setTimeout(tryReconnect, delay);
    }

    // Start auto-retry after 3 seconds
    setTimeout(tryReconnect, 3000);
  </script>
</body>
</html>
